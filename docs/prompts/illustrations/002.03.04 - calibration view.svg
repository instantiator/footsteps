<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" font-family="sans-serif" font-size="13">
  <rect width="720" height="480" fill="#fff"/>
  <!-- camera image: wall above, floor below -->
  <rect x="40" y="40" width="640" height="360" fill="#d9dee5"/>
  <polygon points="40,200 680,200 680,400 40,400" fill="#c4b59a"/>
  <!-- a player standing near the back -->
  <circle cx="420" cy="150" r="10" fill="#555"/>
  <rect x="410" y="162" width="20" height="40" rx="6" fill="#555"/>
  <rect x="412" y="200" width="7" height="40" fill="#555"/><rect x="421" y="200" width="7" height="40" fill="#555"/>
  <!-- floor area -->
  <polygon points="91,364 629,364 520,238 200,238" fill="#2b7de9" fill-opacity="0.18" stroke="#2b7de9" stroke-width="3"/>
  <g fill="#fff" stroke="#2b7de9" stroke-width="3">
    <circle cx="91" cy="364" r="9"/><circle cx="629" cy="364" r="9"/>
    <circle cx="200" cy="238" r="9"/><circle cx="520" cy="238" r="9"/>
  </g>
  <!-- drag hint: any corner moves freely -->
  <g stroke="#c0392b" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)">
    <line x1="164" y1="238" x2="236" y2="238"/>
    <line x1="200" y1="202" x2="200" y2="274"/>
  </g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
  <g fill="#1f2d3d">
    <text x="214" y="196">drag any corner, in any direction</text>
    <text x="96" y="352">front (8%, 90%)</text>
    <text x="530" y="352">(92%, 90%)</text>
    <text x="96" y="290">back (25%, 55%)</text>
    <text x="530" y="266">(75%, 55%)</text>
  </g>
  <!-- buttons -->
  <g font-size="14">
    <rect x="40" y="420" width="190" height="34" rx="6" fill="#eef1f5" stroke="#8a94a3"/><text x="56" y="442">Reset to the default area</text>
    <rect x="242" y="420" width="80" height="34" rx="6" fill="#2b7de9"/><text x="267" y="442" fill="#fff">Save</text>
    <rect x="500" y="420" width="180" height="34" rx="6" fill="#fff" stroke="#c0392b"/><text x="518" y="442" fill="#c0392b">Forget all saved areas</text>
  </g>
  <text x="40" y="28" font-size="14" fill="#1f2d3d">Drag each blue corner to a corner of the space you can walk around in.</text>
</svg>
