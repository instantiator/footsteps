name: Quality gate

# On main, a passing gate is followed by the GitHub Pages deploy (deploy-pages.yaml).
# The same gate as the local pre-push hook: dev-qual's check.sh (format, lint,
# typecheck, build, tests, shell/workflow/markdown linters, aislop). Test results
# appear as annotations and a job summary, and as a downloadable JUnit artefact.
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main queue, so a deploy is never cut short
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the dev-qual submodule)
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # Blocks the build on a resource file or URL that cannot load. `npm test`
      # (inside check.sh) runs the same check through its pretest step, so the
      # pre-push hook and CI agree.
      - name: Validate game data
        run: ./validate-repository.sh public/game-repository.json
      # check.sh skips linters that aren't installed; install them so CI can't pass by skipping
      - name: Install actionlint and markdownlint (shellcheck ships with the runner)
        run: |
          cd "$RUNNER_TEMP"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          npm install --global markdownlint-cli@0.49.1
          shellcheck --version
      - name: Run the quality gate
        run: dev-qual/scripts/check.sh
      # check.sh builds without a base path; this catches breakage in the GitHub Pages layout
      - name: Build for GitHub Pages
        run: npm run build:gh-pages
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yaml
