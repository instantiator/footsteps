name: Quality gate

# The same gate as the local pre-push hook: dev-qual's check.sh (format, lint,
# typecheck, build, tests, shell/workflow/markdown linters, aislop). Test results
# appear as annotations and a job summary, and as a downloadable JUnit artefact.
on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with the dev-qual submodule)
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      # check.sh skips linters that aren't installed; install them so CI can't pass by skipping
      - name: Install actionlint and markdownlint (shellcheck ships with the runner)
        run: |
          cd "$RUNNER_TEMP"
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          npm install --global markdownlint-cli@0.49.1
          shellcheck --version
      - name: Run the quality gate
        run: dev-qual/scripts/check.sh
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn
