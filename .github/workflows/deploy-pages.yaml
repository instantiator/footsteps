name: Deploy to GitHub Pages

# Called by check.yaml once the quality gate passes on main, so nothing is deployed unchecked.
on:
  workflow_call:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deploy at a time; let a started deploy finish rather than cancel it halfway
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      # Build for wherever Pages serves this repo: "/<repo>/", or "/" on a custom domain
      - name: Build
        run: npm run build:gh-pages
        env:
          BASE_URL: ${{ steps.pages.outputs.base_path }}/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist/client"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
