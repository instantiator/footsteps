<div class="jd-screen jd-title">
  <h1>Choose a run</h1>
  <div class="jd-stages">
    {{#each gameState.stages}}
    <div id="stage-link-{{stage.id}}" class="jd-stage-link{{#if showCompleted}} completed{{/if}}" role="button" tabindex="0">
      {{lookup @root.data.names stage.id}}{{#if showCompleted}} ✓{{/if}}
    </div>
    {{/each}}
  </div>
  <p class="jd-hint">Touch a run with your hand, or click it.</p>
</div>
