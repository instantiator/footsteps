<div class="noClicks demo-screen">
  <div class="horizon-background demo-horizon"></div>
  <div class="floor-background demo-ground"></div>
  <h1>Choose a stage</h1>
  <div class="demo-stages">
    {{#each gameState.stages}}
    <div
      id="stage-link-{{stage.id}}"
      class="demo-stage-link{{#if showCompleted}} completed{{/if}}"
      role="button"
      tabindex="0">
      {{oneIndex}}. {{lookup @root.data.names stage.id}}{{#if showCompleted}} ✓{{/if}}
    </div>
    {{/each}}
  </div>
  <div id="candle-left" class="demo-candle demo-candle-left{{#if state.leftLit}} lit{{/if}}">
    <div class="candle-flame"></div>
    <div class="candle-wick"></div>
    <div class="candle-wax"></div>
    <div id="candle-left-tip" class="candle-tip"></div>
  </div>
  <div id="candle-right" class="demo-candle demo-candle-right{{#if state.rightLit}} lit{{/if}}">
    <div class="candle-flame"></div>
    <div class="candle-wick"></div>
    <div class="candle-wax"></div>
    <div id="candle-right-tip" class="candle-tip"></div>
  </div>
</div>
