<div class="noClicks demo-screen">
  <div class="horizon-background demo-horizon"></div>
  <div class="floor-background demo-ground"></div>
  <div class="demo-pits-floor" data-floor-area="0 0 100 100"></div>
  <div id="pit-1" class="pit" data-floor-area="10 44 34 70"></div>
  <div id="pit-2" class="pit" data-floor-area="56 60 80 86"></div>
  <div id="pit-3" class="pit" data-floor-area="34 12 58 38"></div>
  <!-- Warning signs beside the pits: placement owns the outer element, so each lean is a rotate on the inner one -->
  <div class="pit-sign" data-floor-x="8" data-floor-y="72" data-floor-height="9"><div class="pit-sign-lean" style="rotate: -8deg"><div class="pit-sign-board">&#9760;</div></div></div>
  <div class="pit-sign" data-floor-x="84" data-floor-y="88" data-floor-height="9"><div class="pit-sign-lean" style="rotate: 5deg"><div class="pit-sign-board">&#9760;</div></div></div>
  <div class="pit-sign" data-floor-x="30" data-floor-y="36" data-floor-height="9"><div class="pit-sign-lean" style="rotate: -3deg"><div class="pit-sign-board">&#9760;</div></div></div>
  <div id="start" class="demo-start">Start</div>
  <div id="door" class="pits-door" data-floor-x="88" data-floor-y="8"><div id="door-base" class="pits-door-base"></div></div>
  <p id="pits-message" class="demo-score">Reach the door without falling into a pit.</p>
</div>
